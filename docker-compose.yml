networks:
  default:
    name: ucas_network
    
services:
  api-gateway:
    build: ./services/api-gateway
    container_name: ucas-api-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ucas_redis_pass
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./services/api-gateway:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  orchestrator:
    build: ./services/orchestrator
    container_name: ucas-orchestrator
    environment:
      - DATABASE_URL=postgresql://ucas_user:ucas_password_123@postgres:5432/ucas_db
    ports:
      - "8001:8001"
    restart: unless-stopped
    volumes:
      - ./services/orchestrator:/app
      - ucas-categorizers-data:/data
      - ./config:/app/config:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  tags-layer:
    build: ./services/tags-layer
    container_name: ucas-tags-layer
    ports:
      - "8010:8010"
    restart: unless-stopped
    volumes:
      - ./services/tags-layer:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]

  xgboost-layer:
    build: ./services/xgboost-layer
    container_name: ucas-xgboost-layer
    ports:
      - "8020:8020"
    restart: unless-stopped
    volumes:
      - ./services/xgboost-layer:/app
      - ./volumes/models:/data/models
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8020", "--reload"]

  llm-layer:
    build: ./services/llm-layer
    container_name: ucas-llm-layer
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
    ports:
      - "8030:8030"
    restart: unless-stopped
    volumes:
      - ./services/llm-layer:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8030", "--reload"]

  hil-layer:
    build: ./services/hil-layer
    container_name: ucas-hil-layer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ucas_user:ucas_password_123@postgres:5432/ucas_db
    ports:
      - "8040:8040"
    restart: unless-stopped
    volumes:
      - ./services/hil-layer:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8040", "--reload"]

  embeddings-service:
    build: ./services/embeddings-service
    container_name: ucas-embeddings
    ports:
      - "8050:8050"
    restart: unless-stopped
    volumes:
      - ./services/embeddings-service:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8050", "--reload"]

  evaluator:
    build: ./services/evaluator
    container_name: ucas-evaluator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ucas_user:ucas_password_123@postgres:5432/ucas_db
    ports:
      - "8060:8060"
    restart: unless-stopped
    volumes:
      - ./services/evaluator:/app
      - ./config:/app/config:ro
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8060", "--reload"]

  rag-service:
    build: ./services/rag-service
    container_name: ucas-rag-service
    environment:
      - EMBEDDINGS_SERVICE_URL=http://embeddings-service:8050
    ports:
      - "8070:8070"
    restart: unless-stopped
    volumes:
      - ./services/rag-service:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8070", "--reload"]

  ollama:
    container_name: ucas-ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: unless-stopped
    volumes:
      - ./volumes/ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 12G

  postgres:
    build: ./services/postgres
    container_name: ucas-postgres
    environment:
      POSTGRES_DB: ucas_db
      POSTGRES_PASSWORD: ucas_password_123
      POSTGRES_USER: ucas_user
    healthcheck:
      interval: 10s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U ucas_user -d ucas_db"]
      timeout: 5s
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    command: redis-server --appendonly yes --requirepass ucas_redis_pass
    container_name: ucas-redis
    healthcheck:
      interval: 10s
      retries: 5
      test: ["CMD", "redis-cli", "--raw", "ping"]
      timeout: 5s
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis:/data

  dashboard-admin:
    build: ./services/dashboard-admin
    container_name: ucas-dashboard-admin
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - ./services/dashboard-admin:/app
    command: ["streamlit", "run", "app.py", "--server.port", "8080", "--server.address", "0.0.0.0"]

  dashboard-hil:
    build: ./services/dashboard-hil
    container_name: ucas-dashboard-hil
    depends_on:
      - hil-layer
    environment:
      - HIL_LAYER_URL=http://hil-layer:8040
    ports:
      - "8081:8081"
    restart: unless-stopped
    volumes:
      - ./services/dashboard-hil:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]

volumes:
  ucas-categorizers-data:
  postgres:
    driver: local
  redis:
    driver: local